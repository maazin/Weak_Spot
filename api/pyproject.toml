[project]
name = "weakspot"
version = "0.1.0"
description = "Diagnoses why a failed coding-problem attempt failed, then schedules same-pattern review."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    # LangGraph orchestrates the graph; the LLM calls go through the Anthropic SDK
    # directly (see README). anthropic is declared explicitly rather than inherited
    # from a langchain package, so removing one cannot silently break the other.
    "langgraph>=0.2.50",
    "anthropic>=0.40",
    "voyageai>=0.3.2",
    "langfuse>=2.55",
    "prometheus-client>=0.21",
    "mcp>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "anyio>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["weakspot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
