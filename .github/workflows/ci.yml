name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: weakspot
          POSTGRES_PASSWORD: weakspot
          POSTGRES_DB: weakspot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weakspot"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://weakspot:weakspot@localhost:5432/weakspot
      REDIS_URL: redis://localhost:6379/0
      TAXONOMY_PATH: ${{ github.workspace }}/taxonomy/patterns.yaml
      ENV: test
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: api
        run: ruff check . && ruff format --check .
      - name: Test
        working-directory: api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build

  # Evaluation suites gate any change to the taxonomy, prompts, or graph.
  # Suite D (prompt injection) is a hard gate: any failure blocks merge.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: weakspot
          POSTGRES_PASSWORD: weakspot
          POSTGRES_DB: weakspot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weakspot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://weakspot:weakspot@localhost:5432/weakspot
      REDIS_URL: redis://localhost:6379/0
      TAXONOMY_PATH: ${{ github.workspace }}/taxonomy/patterns.yaml
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ENV: test
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - working-directory: api
        run: pip install -e ".[dev]"
      - name: Detect eval-relevant changes
        id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
             | grep -qE '^(taxonomy/|api/weakspot/prompts/|api/weakspot/graph/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run eval suites
        if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        working-directory: api
        run: python -m evals.run_all --commit-sha "${{ github.sha }}" --report /tmp/evals.md
      - name: Post results as PR comment
        if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/evals.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
