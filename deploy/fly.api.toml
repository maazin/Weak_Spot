# Fly.io config for the API. Deploy from the repo root:
#   fly deploy -c deploy/fly.api.toml
#
# Secrets are set separately and never live in this file:
#   fly secrets set ANTHROPIC_API_KEY=... VOYAGE_API_KEY=... SESSION_SECRET=... \
#     DATABASE_URL=... REDIS_URL=... GITHUB_CLIENT_ID=... GITHUB_CLIENT_SECRET=...

app = "weakspot-api"
primary_region = "iad"

[build]
  # Relative to the repo root, which is the build context — the image needs both api/
  # and taxonomy/.
  dockerfile = "api/Dockerfile"

[env]
  ENV = "production"
  # Refused at startup when ENV is production — stated here so the value is explicit
  # rather than merely absent.
  DEV_AUTH_BYPASS = "false"
  # The web app is served from a different host than the API, so the session cookie
  # has to be cross-site or the frontend gets 401 on every authenticated call. Set
  # this to "lax" only if both end up on one registrable domain.
  SESSION_COOKIE_SAMESITE = "none"
  TAXONOMY_PATH = "/taxonomy/patterns.yaml"
  LANGFUSE_HOST = "https://cloud.langfuse.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
