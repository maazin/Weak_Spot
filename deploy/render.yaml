# Render blueprint. Postgres lives on Neon and Redis on Upstash, so only the two
# services are defined here; both connection strings come in as secrets.
#
# Deploy: point a Render Blueprint at this file.

services:
  - type: web
    name: weakspot-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    # Root context: the image needs taxonomy/, which lives outside api/.
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: production
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: TAXONOMY_PATH
        value: /taxonomy/patterns.yaml
      # Set to the full origin of the web service, scheme included, for example
      # https://weakspot-web.onrender.com. `fromService ... property: host` returns a
      # bare hostname, which the CORS check compares against an Origin header that
      # always carries a scheme, so it never matches.
      - key: WEB_ORIGIN
        sync: false
      # The API and the web app sit on different hosts under onrender.com, which is on
      # the Public Suffix List, so they are cross-site. A SameSite=Lax session cookie
      # is not attached to the frontend's fetches and every call returns 401. Leave
      # this at none unless both end up on one registrable domain.
      - key: SESSION_COOKIE_SAMESITE
        value: none
      # Set in the dashboard, not here.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false

  - type: web
    name: weakspot-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    envVars:
      # Vite inlines this into the bundle at build time, so it has to be present for
      # the build command rather than at runtime. Set it to the API's full origin.
      - key: VITE_API_BASE
        sync: false
    routes:
      # Client-side routing: every unmatched path serves the SPA shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
