services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: weakspot
      POSTGRES_PASSWORD: weakspot
      POSTGRES_DB: weakspot
    ports:
      # 5433 on the host to avoid clashing with a local Postgres on the default port.
      # Inside the compose network the API still connects to postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weakspot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://weakspot:weakspot@postgres:5432/weakspot
      REDIS_URL: redis://redis:6379/0
      TAXONOMY_PATH: /taxonomy/patterns.yaml
      ENV: development
      DEV_AUTH_BYPASS: "true"
      SESSION_SECRET: dev-only-not-a-real-secret
      WEB_ORIGIN: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "8000:8000"
    volumes:
      - ./taxonomy:/taxonomy:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
