<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weakspot</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F1EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0C0B" />
    <script>
      // Applied before first paint so a stored choice does not flash the other appearance.
      (function () {
        var t = localStorage.getItem('weakspot-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <meta property="og:title" content="Weakspot" />
    <meta
      property="og:description"
      content="Find out why you actually failed. Then drill the pattern until it sticks."
    />
    <meta property="og:image" content="https://weakspot.app/assets/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="description"
      content="Weakspot diagnoses why a failed coding-problem attempt failed at the conceptual level, then schedules same-pattern problems for spaced review."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
