server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        # `expires` emits its own Cache-Control, so setting both duplicates the header.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on the old bundle
    # while its hashed assets have already been replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths serve the shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
